[package]
name = "shield-controller-datahost"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
clap = { version = "4.6.7", features = ["derive"] }
ozproto = { path = "../vendor/ozproto" }
pcap = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tracing = { version = "0.1", features = ["max_level_off", "release_max_level_off"] }
vigem-client = "0.1.4"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Devices_HumanInterfaceDevice", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading"] }
